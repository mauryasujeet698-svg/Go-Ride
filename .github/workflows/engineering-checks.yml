name: Go-Ride Engineering Checks

on:
  push:
    branches:
      - 'engineering/**'
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'pubspec.lock'
      - '.github/workflows/engineering-checks.yml'

permissions:
  contents: read

concurrency:
  group: engineering-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck and tests (no release build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  customer:
    name: Customer app analyze and tests (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  driver-partner:
    name: Driver Partner app analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver_partner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform for validation
        run: flutter create --platforms=android --org com.goride .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Android debug build smoke test
        run: flutter build apk --debug

  admin:
    name: Admin app analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform for validation
        run: flutter create --platforms=android --org com.goride .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Android debug build smoke test
        run: flutter build apk --debug
