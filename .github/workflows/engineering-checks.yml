name: Go-Ride Customer App Checks

on:
  push:
    branches:
      - 'engineering/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/engineering-checks.yml'

permissions:
  contents: read

concurrency:
  group: customer-app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer:
    name: Customer app analyze, tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Freezed code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.goride .
      - name: Configure Android location permissions
        run: python3 tool/configure_android_location_permissions.py
      - name: Build arm64 Customer debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Report APK size
        run: du -h build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Customer debug APK
        uses: actions/upload-artifact@v4
        with:
          name: go-ride-customer-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
