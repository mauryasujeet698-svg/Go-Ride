name: Go-Ride Build and Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ride-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - name: Build ABI-split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Enforce APK size limit
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            size=$(stat -c%s "$apk")
            echo "$apk: $size bytes"
            if (( size > 25 * 1024 * 1024 )); then echo "APK exceeds 25 MiB"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go-ride-customer-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  build-partner-apps:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            path: apps/admin
          - app: driver-partner
            path: apps/driver_partner
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - name: Build ABI-split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Enforce APK size limit
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            size=$(stat -c%s "$apk")
            echo "$apk: $size bytes"
            if (( size > 25 * 1024 * 1024 )); then echo "APK exceeds 25 MiB"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go-ride-${{ matrix.app }}-apks
          path: ${{ matrix.path }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
