name: Flutter Build

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Older Android plugins may need namespace/buildConfig declarations for AGP 8.
      # Patch only the ephemeral Pub cache; repository dependencies and backend configuration stay unchanged.
      - name: Patch legacy Android plugin metadata for AGP 8
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          for build_file in root.glob("*/android/build.gradle"):
              original = build_file.read_text()
              source = original
              if not re.search(r"^\s*namespace\s", source, re.MULTILINE):
                  manifest = build_file.parent / "src" / "main" / "AndroidManifest.xml"
                  if manifest.exists():
                      match = re.search(r"""\bpackage\s*=\s*["']([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+)["']""", manifest.read_text())
                      if match:
                          namespace = match.group(1)
                          source, count = re.subn(
                              r"(^\s*android\s*\{\s*$)",
                              lambda item: item.group(1) + "\n    namespace '" + namespace + "'",
                              source,
                              count=1,
                              flags=re.MULTILINE,
                          )
                          if count:
                              print(f"Patched namespace: {build_file.parent.parent.name} -> {namespace}")
              # app_links 3.4.1 ships an Android library manifest without a package
              # attribute, so derive its known namespace explicitly for AGP 8.
              if build_file.parent.parent.name == "app_links" and not re.search(r"^\s*namespace\s", source, re.MULTILINE):
                  source, count = re.subn(
                      r"(^\s*android\s*\{\s*$)",
                      lambda item: item.group(1) + "\\n    namespace 'com.llfbandit.app_links'",
                      source,
                      count=1,
                      flags=re.MULTILINE,
                  )
                  if count:
                      print("Patched namespace: app_links -> com.llfbandit.app_links")
              # firebase_core 2.x may declare generated BuildConfig values through
              # its Flutter/Firebase Gradle setup rather than a literal buildConfigField.
              # Enable the AGP 8 feature explicitly in this module on the ephemeral runner.
              if build_file.parent.parent.name.startswith("firebase_core") and not re.search(
                  r"buildFeatures\s*\{[^}]*\bbuildConfig\s+true", source, re.DOTALL
              ):
                  source, count = re.subn(
                      r"(^\s*android\s*\{\s*$)",
                      lambda item: item.group(1) + "\n    buildFeatures {\n        buildConfig true\n    }",
                      source,
                      count=1,
                      flags=re.MULTILINE,
                  )
                  if count:
                      print(f"Enabled BuildConfig for: {build_file.parent.parent.name}")

              if re.search(r"\bbuildConfigField\b", source) and not re.search(
                  r"buildFeatures\s*\{[^}]*\bbuildConfig\s+true", source, re.DOTALL
              ):
                  source, count = re.subn(
                      r"(^\s*android\s*\{\s*$)",
                      lambda item: item.group(1) + "\n    buildFeatures {\n        buildConfig true\n    }",
                      source,
                      count=1,
                      flags=re.MULTILINE,
                  )
                  if count:
                      print(f"Enabled BuildConfig for: {build_file.parent.parent.name}")
              if source != original:
                  build_file.write_text(source)
          PY

      # firebase_core 2.x can request BuildConfig fields without declaring the
      # feature itself. Apply the documented AGP compatibility switch on the CI runner.
      - name: Enable legacy library BuildConfig for AGP 8
        shell: bash
        run: |
          if grep -q '^android.defaults.buildfeatures.buildconfig=' android/gradle.properties; then
            sed -i 's/^android.defaults.buildfeatures.buildconfig=.*/android.defaults.buildfeatures.buildconfig=true/' android/gradle.properties
          else
            printf '\\nandroid.defaults.buildfeatures.buildconfig=true\\n' >> android/gradle.properties
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed --line-length=120 $(find lib test -name "*.dart" -not -name "*.mocks.dart")

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Verify translations
        shell: bash
        run: |
          if [[ "$( < lib/l10n/untranslatedMessages.txt )" == "{}" ]]; then
            exit 0
          else
            exit 1
          fi

      # This is an installable CI test APK, signed with Android's debug key.
      # It is not a production/Play Store release. The source build.gradle is
      # left unchanged; only the ephemeral runner copy is adjusted for signing.
      - name: Build optimized per-ABI APKs
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          echo "APK sizes (bytes):"
          find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f -printf '%f %s\n' | sort
          while IFS= read -r apk; do
            size=$(stat -c%s "$apk")
            if [ "$size" -gt $((25 * 1024 * 1024)) ]; then
              echo "APK exceeds 25 MiB limit: $apk ($size bytes)"
              exit 1
            fi
            echo "Verified size limit: $apk ($size bytes)"
          done < <(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-ride-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate coverage_helper file
        run: ./scripts/coverage_helper.sh

      - name: Run tests
        run: flutter test --coverage

      - uses: codecov/codecov-action@v3
